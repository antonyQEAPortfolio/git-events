name: Events Demo 1
on:
  push:
    branches: [ GitAction ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'      
      - name: Install dependencies
        working-directory: ./GitActionProject
        run: npm ci      
      - name: Run build
        working-directory: ./GitActionProject
        run: npm run build
